name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html
            git fetch --all
            git reset --hard origin/main
            # Vanhan sivuston ohjaukset: taulukosta Apachen ohjaustiedosto.
            # Jos taulukossa on virhe, edellinen ohjaustiedosto jää voimaan ja ajo näkyy punaisena.
            python3 ohjaukset/tee-rewritemap.py
